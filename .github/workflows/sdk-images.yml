name: SDK images

# One image per SDK the build uses, with the SDK already unpacked. Every tag
# here must match an `arch:`/`sdk:` value in build.yml; one that is not
# published fails the build with a pull error. Re-run after moving a pin.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/sdk.Dockerfile
      - .github/workflows/sdk-images.yml

permissions:
  contents: read
  packages: write

concurrency:
  group: sdk-images
  cancel-in-progress: false

jobs:
  bake:
    name: bake ${{ matrix.sdk }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        sdk:
          - x86_64-24.10.0
          - x86_64-24.10.8
          - x86_64-25.12.5
          - aarch64_cortex-a53-24.10.8
          - aarch64_cortex-a53-25.12.5
          - arm_cortex-a7_neon-vfpv4-24.10.8
          - arm_cortex-a7_neon-vfpv4-25.12.5
          - mipsel_24kc-24.10.8
          - mipsel_24kc-25.12.5
          - mips_24kc-24.10.8
          - mips_24kc-25.12.5

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Bake and push
        run: |
          image=ghcr.io/${{ github.repository }}/sdk:${{ matrix.sdk }}
          # Empty context: the Dockerfile copies nothing, and the repository
          # would be megabytes of upload for none.
          docker build \
            --build-arg "ARCH=${{ matrix.sdk }}" \
            --tag "$image" \
            - < .github/sdk.Dockerfile
          docker push "$image"
          docker image inspect "$image" --format 'unpacked size: {{.Size}} bytes'
