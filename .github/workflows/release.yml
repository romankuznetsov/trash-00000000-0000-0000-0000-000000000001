# Publishing: the GitHub release and the signed feed on Pages. The building is
# build.yml's, called below, so a release ships what a pull request built.
---
name: Release

on:
  push:
    tags: ['v*']
  # Dispatch reaches the feed without spending a tag. The release job stays
  # behind its own tag condition, so a dispatch publishes a feed and no release.
  workflow_dispatch:

permissions:
  contents: read

# Never cancel: a half-run release job is worse than a redundant one.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read
      packages: read
    secrets: inherit

  # Signing the index is what makes the packages trusted: apk verifies the
  # index, then trusts packages by the hashes in it. The individual .apk files
  # are never signed.
  feed:
    name: publish feed
    needs: build
    # Publishing repositories only: a fork has neither the signing secrets nor a
    # Pages site, so a contributor's dispatch would go red on something not
    # theirs. A repository variable rather than a hardcoded name, so the
    # sandbox can rehearse a release without carrying a patched copy of this
    # file -- which is how a sandbox-only edit nearly reached main once.
    if: >-
      vars.PUBLISH == 'true' &&
      (startsWith(github.ref, 'refs/tags/v') ||
       github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Check out
        uses: actions/checkout@v7

      # The two formats land in separate directories because both artifacts
      # carry an x86_64/qwdtt/ and would otherwise overwrite each other.
      - name: Download the apk packages
        uses: actions/download-artifact@v8
        with:
          name: packages-x86_64-25.12.5
          path: staged-apk

      - name: Download the ipk packages
        uses: actions/download-artifact@v8
        with:
          name: packages-x86_64-24.10.0
          path: staged-ipk

      # The clients can share one directory: an architecture's .ipk and .apk
      # differ by extension, and each is picked up by its own glob below.
      - name: Download the client packages
        uses: actions/download-artifact@v8
        with:
          pattern: client-package-*
          merge-multiple: true
          path: staged

      # Keyed by OpenWrt release because the format follows it. Every
      # architecture's directory also gets the three noarch packages, so one
      # feed URL serves a router everything.
      - name: Assemble the feed
        run: |
          mkdir -p noarch-apk noarch-ipk
          cp staged-apk/x86_64/qwdtt/qwdtt-[0-9]*.apk \
             staged-apk/x86_64/qwdtt/luci-*.apk noarch-apk/
          cp staged-ipk/x86_64/qwdtt/qwdtt_[0-9]*.ipk \
             staged-ipk/x86_64/qwdtt/luci-*.ipk noarch-ipk/

          for d in staged/*/qwdtt; do
            arch=$(basename "$(dirname "$d")")

            if ls "$d"/qwdtt-client-*.apk >/dev/null 2>&1; then
              mkdir -p "site/releases/25.12/$arch"
              cp "$d"/qwdtt-client-*.apk noarch-apk/*.apk "site/releases/25.12/$arch/"
            fi

            if ls "$d"/qwdtt-client_*.ipk >/dev/null 2>&1; then
              mkdir -p "site/releases/24.10/$arch"
              cp "$d"/qwdtt-client_*.ipk noarch-ipk/*.ipk "site/releases/24.10/$arch/"
            fi
          done
          find site -type f \( -name '*.apk' -o -name '*.ipk' \) | sort

      - name: Sign the index
        env:
          APK_PRIVATE_KEY: ${{ secrets.APK_PRIVATE_KEY }}
        run: |
          test -n "$APK_PRIVATE_KEY" || {
            echo "APK_PRIVATE_KEY is not set; the feed would be unusable"
            exit 1
          }

          # The key goes in through the environment and is written inside the
          # container, never the workspace. Root because the bind mount is the
          # runner's and the image's own user is a different uid.
          docker run --rm --user 0:0 -e APK_PRIVATE_KEY \
            -v "$PWD:/w" -w /w ghcr.io/openwrt/sdk:x86_64-25.12.5 \
            sh -c 'umask 077
                   printf "%s\n" "$APK_PRIVATE_KEY" > /tmp/key.pem
                   for d in /w/site/releases/25.12/*; do
                     ( cd "$d" && /builder/staging_dir/host/bin/apk mkndx \
                         --allow-untrusted \
                         --sign /tmp/key.pem \
                         --output packages.adb *.apk ) || exit 1
                   done'

          sudo chown -R "$(id -u):$(id -g)" site
          find site -name packages.adb -exec ls -l {} \;

      # opkg verifies Packages.sig with usign -- a different key and tool from
      # the apk side above. The 24.10 SDK carries both.
      - name: Sign the opkg index
        env:
          IPK_PRIVATE_KEY: ${{ secrets.IPK_PRIVATE_KEY }}
        run: |
          test -n "$IPK_PRIVATE_KEY" || {
            echo "IPK_PRIVATE_KEY is not set; the 24.10 feed would be unusable"
            exit 1
          }

          docker run --rm --user 0:0 -e IPK_PRIVATE_KEY \
            -v "$PWD:/w" -w /w "ghcr.io/${{ github.repository }}/sdk:x86_64-24.10.8" \
            sh -c 'set -e
                   # Scoped to the key: over the whole block the umask also
                   # lands on Packages, which verify then cannot read.
                   ( umask 077; printf "%s\n" "$IPK_PRIVATE_KEY" > /tmp/key-build )
                   # ipkg-make-index.sh hashes through $MKHASH, which the build
                   # normally exports; unset it silently becomes `sha256`.
                   export MKHASH=/builder/staging_dir/host/bin/mkhash
                   for d in /w/site/releases/24.10/*; do
                     ( cd "$d" && /builder/scripts/ipkg-make-index.sh . > Packages &&
                       gzip -9nc Packages > Packages.gz &&
                       /builder/staging_dir/host/bin/usign \
                         -S -m Packages -s /tmp/key-build -x Packages.sig ) || exit 1
                   done'

          sudo chown -R "$(id -u):$(id -g)" site
          find site -name 'Packages*' -exec ls -l {} \;

      # The whole promise of the feed: if this passes, a router trusting these
      # keys installs without --allow-untrusted.
      - name: Verify the index against the published public key
        run: |
          cp keys/qwdtt.pem site/qwdtt.pem
          cp keys/qwdtt-usign.pub site/qwdtt-usign.pub
          docker run --rm -v "$PWD:/w" -w /w ghcr.io/openwrt/sdk:x86_64-25.12.5 \
            sh -c 'mkdir -p /tmp/k && cp /w/keys/qwdtt.pem /tmp/k/
                   for i in /w/site/releases/25.12/*/packages.adb; do
                     printf "%s: " "$i"
                     /builder/staging_dir/host/bin/apk verify --keys-dir /tmp/k "$i" || exit 1
                   done'

          docker run --rm -v "$PWD:/w" -w /w \
            "ghcr.io/${{ github.repository }}/sdk:x86_64-24.10.8" \
            sh -c 'u=/builder/staging_dir/host/bin/usign
                   echo "usign key id: $($u -F -p /w/keys/qwdtt-usign.pub)"
                   for i in /w/site/releases/24.10/*/Packages; do
                     printf "%s: " "$i"
                     $u -V -m "$i" -p /w/keys/qwdtt-usign.pub -x "$i.sig" &&
                       echo OK || exit 1
                   done'

      - name: Generate the site
        run: |
          .github/scripts/generate-feed-pages.sh site             "https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}"

      # The theme only exists in the github-pages gem set, so the site has to
      # be built here; upload-pages-artifact serves the directory as-is.
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: site
          destination: _site

      - name: Upload the site
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy to Pages
        id: deploy
        uses: actions/deploy-pages@v5

  release:
    name: Publish release
    needs: build
    # Same guard as the feed job.
    if: >-
      vars.PUBLISH == 'true' &&
      startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Download every artifact
        uses: actions/download-artifact@v8
        with:
          merge-multiple: true
          path: dist

      # An apk filename carries no architecture, so every client build arrives
      # as qwdtt-client-<version>.apk and they collide as release assets, which
      # are keyed by basename. The arch is the artifact's first path component.
      - name: Name the client packages after their architecture
        run: |
          for f in dist/*/qwdtt/qwdtt-client-*.apk; do
            [ -e "$f" ] || continue
            arch=$(basename "$(dirname "$(dirname "$f")")")
            mv "$f" "dist/$(basename "$f" .apk)-$arch.apk"
          done

      # Shaped as an OpenWrt backup archive: restoring one under System ->
      # Backup is the only way to place a key file without shell access.
      - name: Build the key archives
        run: |
          mkdir -p apkroot/etc/apk/keys
          cp keys/qwdtt.pem apkroot/etc/apk/keys/qwdtt.pem
          tar -C apkroot -czf dist/qwdtt-apk-key.tar.gz etc
          tar -tzvf dist/qwdtt-apk-key.tar.gz

          # opkg finds a key by its id, so the file must be named for it. A
          # usign public key is a 2-byte algorithm tag then the 8-byte id --
          # hence skip two, take eight.
          keyid=$(sed -n '2p' keys/qwdtt-usign.pub | base64 -d |
                  od -An -tx1 -j2 -N8 | tr -d ' \n')
          echo "usign key id: $keyid"
          mkdir -p opkgroot/etc/opkg/keys
          cp keys/qwdtt-usign.pub "opkgroot/etc/opkg/keys/$keyid"
          tar -C opkgroot -czf dist/qwdtt-opkg-key.tar.gz etc
          tar -tzvf dist/qwdtt-opkg-key.tar.gz

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets=$(find dist -type f \
            \( -name '*.tar.gz' -o -name '*.ipk' -o -name '*.apk' \) | sort)
          echo "$assets"

          # Assets are keyed by basename, so two files sharing one cannot both
          # be published. Fail rather than silently drop one.
          dupes=$(echo "$assets" | xargs -n1 basename | sort | uniq -d)
          if [ -n "$dupes" ]; then
            echo "duplicate asset names:"
            echo "$dupes"
            exit 1
          fi

          gh release create "${GITHUB_REF_NAME}" $assets \
            --repo "$GITHUB_REPOSITORY" \
            --title "qWDTT OpenWrt ${GITHUB_REF_NAME}" \
            --notes "Indexing assets..."

      # From the names GitHub stored, not the staging directory: it rewrites
      # characters it will not serve, so luci-i18n's `~` becomes `.`.
      - name: Compose the download table
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME"
          arches="aarch64_cortex-a53 arm_cortex-a7_neon-vfpv4 mipsel_24kc x86_64"
          noarch="qwdtt luci-app-qwdtt luci-i18n-qwdtt-ru"
          names=$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
                    --json assets -q '.assets[].name')

          # A file belongs to a target if its name contains that pkgarch.
          link() {  # ext target -> <a> for its file, or N/A
            for f in $(echo "$names" | grep "\.$1$" | sort); do
              a=All
              for k in $arches; do case "$f" in *"$k"*) a=$k ;; esac; done
              [ "$a" = "$2" ] && { printf '<a href="%s/%s">%s</a>' "$base" "$f" "$f"; return; }
            done
            printf 'N/A'
          }
          noarch_link() {  # pkg ext -> <a> for the noarch build of pkg, or N/A
            for f in $(echo "$names" | grep -E "^$1[_-].*\.$2$" | sort); do
              # the pattern also catches per-arch builds (qwdtt- matches qwdtt-client-); drop them
              for k in $arches; do case "$f" in *"$k"*) continue 2 ;; esac; done
              printf '<a href="%s/%s">%s</a>' "$base" "$f" "$f"; return
            done
            printf 'N/A'
          }

          {
            echo "### Packages"
            echo
            echo "Install **qwdtt-client** for your target plus the **All** packages."
            echo
            echo "<table>"
            echo "<tr><th>Target</th><th>IPK</th><th>APK (OpenWrt 25.12+)</th></tr>"
            for k in $(printf '%s\n' $arches | sort); do
              echo "<tr><td>$k</td><td>$(link ipk "$k")</td><td>$(link apk "$k")</td></tr>"
            done
            n=$(set -- $noarch; echo $#)
            first=1
            for pkg in $noarch; do
              if [ "$first" = 1 ]; then
                echo "<tr><td rowspan=\"$n\">All</td><td>$(noarch_link "$pkg" ipk)</td><td>$(noarch_link "$pkg" apk)</td></tr>"
                first=0
              else
                echo "<tr><td>$(noarch_link "$pkg" ipk)</td><td>$(noarch_link "$pkg" apk)</td></tr>"
              fi
            done
            echo "</table>"
          } > body.md
          cat body.md

          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --notes-file body.md
