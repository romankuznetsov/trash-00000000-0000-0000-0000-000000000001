# One repository, three things to build: the Go client, the OpenWrt packages
# that wrap it, and the standalone tarballs that predate them.
#
# The jobs are split by cost rather than by product.
#
#   check, client      ~1 min, every push
#   packages           ~10 min, only when a package directory changed
#   client-packages    ~15 min per architecture, tags and dispatch only
#   feed, release      tags and dispatch, this repository only
#
# Two thirds of a client-packages job is spent building the kernel (for
# kmod-tun) and the Go toolchain, neither of which we change. Caching that in
# a pre-built SDK image would cut it to about five minutes, and is worth doing
# if releases ever become frequent.
---
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Two pushes in quick succession would otherwise pay for two full builds, and
# the first result is stale the moment the second lands. Grouping by ref keeps
# main and a tag in separate groups, so publishing a release is never cancelled
# by an unrelated push -- and tag runs opt out of cancellation entirely, since a
# half-run release job is worse than a redundant one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  GO_VERSION: "1.26.x"

jobs:
  # Most of the pipeline is wasted on a docs-only push. Diff the push here and
  # let the build jobs gate on it: `code` guards the Go check and client build,
  # `packages` guards the SDK packages. Tags and dispatches always build, so a
  # release is never gated on a diff.
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.decide.outputs.code }}
      packages: ${{ steps.decide.outputs.packages }}
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Decide what needs building
        id: decide
        run: |
          if [ "${{ github.event_name }}" != "push" ] ||
             [ "${{ startsWith(github.ref, 'refs/tags/') }}" = "true" ]; then
            echo "not a branch push: building everything"
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "packages=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          base="${{ github.event.before }}"
          # A new branch reports an all-zero before, and a force-push can name
          # a commit that no longer exists. Neither is a diff we can trust.
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] ||
             ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "no usable base commit: building everything"
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "packages=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed=$(git diff --name-only "$base" "${{ github.sha }}")
          echo "changed files:"; echo "$changed" | sed 's/^/  /'
          if echo "$changed" | grep -qE '^client/|^\.github/workflows/'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi
          if echo "$changed" | grep -qE '^(qwdtt|luci-app-qwdtt|qwdtt-client)/|^\.github/workflows/'; then
            echo "packages=true" >> "$GITHUB_OUTPUT"
          else
            echo "packages=false" >> "$GITHUB_OUTPUT"
          fi

  check:
    name: check
    needs: changes
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.packages == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: client/go.sum

      # Meaningful only because .gitattributes checks the tree out with LF: on
      # a CRLF checkout gofmt reports every file and the gate says nothing.
      - name: gofmt
        working-directory: client
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "not gofmt-clean:"
            echo "$unformatted"
            gofmt -d .
            exit 1
          fi

      # -tags=openwrt on both: without it the wrong raw-socket implementation
      # is selected, so an untagged run checks code the release never builds.
      - name: vet
        working-directory: client
        run: go vet -tags=openwrt ./...

      - name: test
        working-directory: client
        run: go test -tags=openwrt ./...

  client:
    name: client ${{ matrix.name }}
    needs: [changes, check]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # pkgarch is the OpenWrt package architecture for the 24.10 .ipk, the
        # same four the 25.12 apk feed targets, so both cover identical
        # hardware. name is the generic label the tarball carries.
        include:
          - name: x86_64
            goarch: amd64
            pkgarch: x86_64
          - name: aarch64
            goarch: arm64
            pkgarch: aarch64_cortex-a53
          - name: armv7
            goarch: arm
            goarm: "7"
            pkgarch: arm_cortex-a7_neon-vfpv4
          - name: mipsel
            goarch: mipsle
            gomips: softfloat
            pkgarch: mipsel_24kc

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: client/go.sum

      # Into dist/ and not the repository root: qwdtt-client is a package
      # directory now, so `-o ../qwdtt-client` would be writing over it.
      - name: Build static client
        working-directory: client
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          GOMIPS: ${{ matrix.gomips }}
        run: go build -tags=openwrt -trimpath -ldflags="-s -w" -o ../dist/qwdtt-client .

      # The binary and its licence, nothing else. The archive used to carry an
      # installer and a files/ tree, but those shipped a second /etc/init.d/qwdtt
      # and /etc/config/qwdtt on a UCI schema the LuCI page does not use, so the
      # two install paths contradicted each other. Packages are the install
      # path now; this is for dropping the binary somewhere by hand.
      - name: Pack archive
        run: |
          cp LICENSE dist/
          tar -C dist -czf "qwdtt-openwrt-${{ matrix.name }}.tar.gz" \
            qwdtt-client LICENSE

      - name: Upload archive
        uses: actions/upload-artifact@v7
        with:
          name: tarball-${{ matrix.name }}
          path: qwdtt-openwrt-${{ matrix.name }}.tar.gz
          if-no-files-found: error
          retention-days: 90

      # A 24.10 (opkg) .ipk from the same static binary. The 24.10 SDK cannot
      # compile the Go client (Go floor), so this wraps the prebuilt ELF into an
      # .ipk by hand -- no SDK Go toolchain, no signing. It is what lets a 24.10
      # user install the client through LuCI with no SSH, next to the
      # architecture-'all' .ipk the packages job builds; the 25.12 feed ships the
      # client as a source-built .apk, so this is 24.10's counterpart. Version
      # comes from the qwdtt-client Makefile so there is one source of truth.
      - name: Pack the client ipk (OpenWrt 24.10, opkg)
        run: |
          ver="$(sed -n 's/^PKG_VERSION:=//p' qwdtt-client/Makefile)-$(sed -n 's/^PKG_RELEASE:=//p' qwdtt-client/Makefile)"
          sh tools/pack-client-ipk.sh dist/qwdtt-client "${{ matrix.pkgarch }}" "$ver" dist

      - name: Upload the client ipk
        uses: actions/upload-artifact@v7
        with:
          name: client-ipk-${{ matrix.pkgarch }}
          path: dist/qwdtt-client_*_${{ matrix.pkgarch }}.ipk
          if-no-files-found: error
          retention-days: 90

  packages:
    name: packages ${{ matrix.label }}
    needs: [changes, check]
    if: needs.changes.outputs.packages == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # The reason for two entries is the package FORMAT rather than the
          # architecture: OpenWrt replaced opkg with apk, so 24.10 emits .ipk
          # and 25.12 emits .apk from identical sources. Both packages here set
          # PKGARCH:=all, so one architecture serves every target.
          #
          # Both pinned to a release. The bare x86_64 tag is the snapshot SDK,
          # which does not ship the SDK inside the image and so downloads and
          # extracts it on every run. Pinning also makes a red build mean
          # something: on snapshot an upstream break and a break of ours are
          # indistinguishable.
          - label: 24.10 (ipk)
            arch: x86_64-24.10.0
          - label: 25.12 (apk)
            arch: x86_64-25.12.5

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Build with the OpenWrt SDK
        # Pinned, not @main. The action's entrypoint decides how the feed is
        # wired, which packages are built and where the output lands, so
        # tracking its default branch means an upstream commit can change this
        # build without anything here changing. build.sh pins the same tag,
        # because a green local build and a green CI run are only the same
        # statement while both run the same entrypoint.
        uses: openwrt/gh-action-sdk@v11
        env:
          ARCH: ${{ matrix.arch }}
          FEEDNAME: qwdtt
          # qwdtt-client is deliberately absent: it needs go >= 1.25, which
          # 24.10 cannot supply at all, and on 25.12 it costs half an hour.
          # The client-packages job below builds it on tags.
          #
          # Only source packages are named. PACKAGES becomes
          # `make package/<name>/download`, so each entry must be a package
          # DIRECTORY -- and luci-i18n-qwdtt-ru is not one. luci.mk defines it
          # from the app's own Makefile by scanning po/*, so listing it fails
          # with "No rule to make target". Building luci-app-qwdtt emits it;
          # the next step asserts that.
          PACKAGES: luci-app-qwdtt qwdtt

      - name: Show what was produced
        run: |
          # The parentheses matter. Without them find reads this as
          #   ( -name '*.ipk' ) OR ( -name '*.apk' AND -print )
          # because -o binds looser than the implicit AND, so an action written
          # after the -o applies only to the second branch.
          find bin -type f \( -name '*.ipk' -o -name '*.apk' \) -print | sort
          for want in luci-app-qwdtt luci-i18n-qwdtt-ru qwdtt; do
            n=$(find bin/packages -type f \
                  \( -name "$want*.ipk" -o -name "$want*.apk" \) | wc -l)
            echo "$want: $n"
            test "$n" -gt 0 || { echo "$want was not produced"; exit 1; }
          done

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: packages-${{ matrix.arch }}
          # Only our own. The SDK also builds ~100 dependency packages into
          # bin/, and a wider glob would bury the files anybody wants.
          path: |
            bin/packages/*/qwdtt/*.ipk
            bin/packages/*/qwdtt/*.apk
          if-no-files-found: error

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: logs-${{ matrix.arch }}
          path: logs/
          if-no-files-found: ignore

  client-packages:
    name: client package ${{ matrix.arch }}
    needs: check
    # Tags only. Each of these compiles a Go toolchain inside the SDK before it
    # compiles anything of ours, measured at ~30 minutes cold per architecture.
    # Also on manual dispatch, so a change to how the client is compiled can be
    # proven across every architecture without spending a tag to find out.
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # A Go binary is architecture-specific, so unlike the two packages
        # above this needs one build per target. The first two are the routers
        # this is deployed to; the other two are what most consumer hardware
        # runs -- mipsel_24kc covers ath79 and ramips, arm_cortex-a7 covers
        # mt7621 and ipq40xx. Add an entry to serve another.
        arch:
          - x86_64-25.12.5
          - aarch64_cortex-a53-25.12.5
          - mipsel_24kc-25.12.5
          - arm_cortex-a7_neon-vfpv4-25.12.5

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Build with the OpenWrt SDK
        uses: openwrt/gh-action-sdk@v11
        env:
          ARCH: ${{ matrix.arch }}
          FEEDNAME: qwdtt
          PACKAGES: qwdtt-client

      - name: Show what was produced
        run: |
          find bin -type f -name 'qwdtt-client*.apk' -print | sort
          n=$(find bin/packages -type f -name 'qwdtt-client*.apk' | wc -l)
          test "$n" -gt 0 || { echo "qwdtt-client was not produced"; exit 1; }

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: client-package-${{ matrix.arch }}
          path: bin/packages/*/qwdtt/qwdtt-client*.apk
          if-no-files-found: error

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: logs-client-${{ matrix.arch }}
          path: logs/
          if-no-files-found: ignore

  # A signed apk repository, which is the only way a LuCI-only user can install
  # these. Uploading a package file through LuCI cannot work: its backend runs
  # `apk add <file>` and never passes --allow-untrusted, and the individual
  # .apk files are not signed with our key anyway -- OpenWrt's mkpkg takes no
  # --sign, CONFIG_SIGNED_PACKAGES only signs the index. Signing the index here
  # is what makes the packages trusted, because apk verifies the index and then
  # trusts the packages by the hashes recorded in it.
  feed:
    name: publish feed
    needs: [packages, client-packages]
    # Dispatch too, for the same reason as client-packages: publishing a feed
    # has enough moving parts that proving it should not cost a tag.
    #
    # Only on this repository: a fork has neither APK_PRIVATE_KEY nor a Pages
    # site, so without the guard a contributor's dispatch goes red on
    # something that is not their problem.
    if: >-
      github.repository == 'romankuznetsov/qwdtt-openwrt' &&
      (startsWith(github.ref, 'refs/tags/v') ||
       github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Check out
        uses: actions/checkout@v7

      # The apk side only. The 24.10 artifacts are .ipk, which need a usign
      # key-build and an opkg-style index rather than this one.
      - name: Download the apk packages
        uses: actions/download-artifact@v8
        with:
          name: packages-x86_64-25.12.5
          path: staged

      - name: Download the client packages
        uses: actions/download-artifact@v8
        with:
          pattern: client-package-*
          merge-multiple: true
          path: staged

      # Every architecture's directory gets that architecture's client plus the
      # three noarch packages, so one feed URL serves a router everything.
      - name: Assemble the feed
        run: |
          mkdir -p noarch
          cp staged/x86_64/qwdtt/qwdtt-[0-9]*.apk \
             staged/x86_64/qwdtt/luci-*.apk noarch/
          for d in staged/*/qwdtt; do
            arch=$(basename "$(dirname "$d")")
            mkdir -p "site/packages/$arch"
            cp "$d"/qwdtt-client-*.apk "site/packages/$arch/" 2>/dev/null || true
            cp noarch/*.apk "site/packages/$arch/"
          done
          find site -name '*.apk' | sort

      - name: Sign the index
        env:
          APK_PRIVATE_KEY: ${{ secrets.APK_PRIVATE_KEY }}
        run: |
          test -n "$APK_PRIVATE_KEY" || {
            echo "APK_PRIVATE_KEY is not set; the feed would be unusable"
            exit 1
          }

          # The key is handed to the container through the environment and
          # written inside it, so it never lands in the workspace. As root,
          # because the bind mount is owned by the runner and the image's own
          # user is a different uid -- it has to write packages.adb back out.
          #
          # The SDK image carries apk; the action's own image is only this plus
          # an entrypoint, so the base serves here.
          docker run --rm --user 0:0 -e APK_PRIVATE_KEY \
            -v "$PWD:/w" -w /w ghcr.io/openwrt/sdk:x86_64-25.12.5 \
            sh -c 'umask 077
                   printf "%s\n" "$APK_PRIVATE_KEY" > /tmp/key.pem
                   for d in /w/site/packages/*; do
                     ( cd "$d" && /builder/staging_dir/host/bin/apk mkndx \
                         --allow-untrusted \
                         --sign /tmp/key.pem \
                         --output packages.adb *.apk ) || exit 1
                   done'

          sudo chown -R "$(id -u):$(id -g)" site
          find site -name packages.adb -exec ls -l {} \;

      # Verifying with the public key alone is the whole promise of the feed:
      # if this passes, a router that trusts this key installs without
      # --allow-untrusted.
      - name: Verify the index against the published public key
        run: |
          cp keys/qwdtt.pem site/qwdtt.pem
          docker run --rm -v "$PWD:/w" -w /w ghcr.io/openwrt/sdk:x86_64-25.12.5 \
            sh -c 'mkdir -p /tmp/k && cp /w/keys/qwdtt.pem /tmp/k/
                   for i in /w/site/packages/*/packages.adb; do
                     printf "%s: " "$i"
                     /builder/staging_dir/host/bin/apk verify --keys-dir /tmp/k "$i" || exit 1
                   done'

      - name: Write the landing page
        run: |
          repo_url="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}"
          {
            echo '<!doctype html><meta charset="utf-8">'
            echo "<title>qWDTT OpenWrt feed</title>"
            echo "<h1>qWDTT OpenWrt package feed</h1>"
            echo "<p>Signed with <a href=\"qwdtt.pem\">qwdtt.pem</a>."
            echo "Install that key once, then add one of these lines under"
            echo "<em>System &rarr; Software &rarr; Configuration</em>:</p><pre>"
            for d in site/packages/*; do
              echo "$repo_url/packages/$(basename "$d")/packages.adb"
            done
            echo '</pre>'
          } > site/index.html
          cat site/index.html

      - name: Upload the site
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Deploy to Pages
        id: deploy
        uses: actions/deploy-pages@v5

  release:
    name: Publish release
    needs: [client, packages, client-packages]
    # Same guard as the feed job: a fork tagging its own work should not try to
    # publish a release here.
    if: >-
      github.repository == 'romankuznetsov/qwdtt-openwrt' &&
      startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # Needed for keys/qwdtt.pem below. A job that only downloads artifacts
      # still starts with an empty workspace.
      - name: Check out
        uses: actions/checkout@v7

      - name: Download every artifact
        uses: actions/download-artifact@v8
        with:
          merge-multiple: true
          path: dist

      # A release asset is named by its basename, and an apk filename carries no
      # architecture: both client builds arrive as qwdtt-client-<version>.apk
      # and would collide, leaving one architecture unpublished. The
      # architecture is the first path component inside the artifact, so fold
      # it into the name. The .ipk side already carries an arch suffix.
      - name: Name the client packages after their architecture
        run: |
          for f in dist/*/qwdtt/qwdtt-client-*.apk; do
            [ -e "$f" ] || continue
            arch=$(basename "$(dirname "$(dirname "$f")")")
            mv "$f" "dist/$(basename "$f" .apk)-$arch.apk"
          done

      # The trust key, shaped as an OpenWrt backup archive. Restoring it under
      # System -> Backup is the only way to place a file in /etc/apk/keys
      # without shell access: LuCI's package-manager Configuration modal edits
      # the repository lists and nothing else.
      - name: Build the key archive
        run: |
          mkdir -p keyroot/etc/apk/keys
          cp keys/qwdtt.pem keyroot/etc/apk/keys/qwdtt.pem
          tar -C keyroot -czf dist/qwdtt-apk-key.tar.gz etc
          tar -tzvf dist/qwdtt-apk-key.tar.gz

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets=$(find dist -type f \
            \( -name '*.tar.gz' -o -name '*.ipk' -o -name '*.apk' \) | sort)
          echo "$assets"

          # Fail loudly rather than let the upload silently drop one of a pair:
          # assets are keyed by basename, so two files sharing one cannot both
          # be published.
          dupes=$(echo "$assets" | xargs -n1 basename | sort | uniq -d)
          if [ -n "$dupes" ]; then
            echo "duplicate asset names:"
            echo "$dupes"
            exit 1
          fi

          gh release create "${GITHUB_REF_NAME}" $assets \
            --repo "$GITHUB_REPOSITORY" \
            --title "qWDTT OpenWrt ${GITHUB_REF_NAME}" \
            --generate-notes
